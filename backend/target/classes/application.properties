# ==========================================
# FinWise AI Backend Configuration (MySQL)
# ==========================================
server.port=8080
server.servlet.context-path=/

# MySQL Database Persistence Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/finwise_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
